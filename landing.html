<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <!-- CSS only -->
  <link href="./styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <title>Dungeon Designer</title>
</head>

<body>
  <div id="landing-menu-card" class="card landing-menu-card">
    <header id="landing-header" class="landing-header">
      <img style="margin: auto;" src="./Assets/dungeondesignerlogo.png" />
    </header>
    <div id="landing-body" class="card-body landing-body">
      <div id="landing-menu" class="flex-container landing-menu">
        <div>
          <button id="new-project-button" title="New Project" type="button" id="open-file-button"
            class="primary-button landing-button"><img src="./Assets/dagger.png" width="60px" />
        </div>
        <div>
          <button id="load-project-button" title="Load Project" type="button" id="open-file-button"
            class="secondary-button landing-button"><img src="./Assets/bow.png" width="60px" /></button>
        </div>
        <div>
          <button id="quit-button" title="Quit" type="button" id="open-file-button"
            class="exit-button landing-button"><img src="./Assets/skull.png" width="60px" />
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="new-project-card" class="card new-project-menu-card">
    <header id="new-project-menu-header" class="new-project-menu-header">
      <img style="margin: auto;" src="./Assets/dungeondesignerlogo.png" />
    </header>
    <div id="new-project-card-body" class="new-project-card-body card-body">
      <div id="new-project-menu">
        <div class="grid-container project-creation-panel">
          <div style="grid-column: 1 / span 4; grid-row: 1;">
            <fieldset>
              <legend>Project Settings</legend>
              <div class="grid-container">
                <div style="grid-column: 1 / span 2; grid-row: 1;">
                  <label for="projectName">Name:</label>
                  <input type="text" id="project-name-input" name="projectName" placeholder="Project name..."
                    value="Test">
                </div>
                <div style="grid-column: 3; grid-row: 1;">
                  <label for="tilesizes">Default Tile Size:</label>
                  <select name="tilesizes" id="tile-size-select">
                    <option value="16">16</option>
                    <option value="32" selected>32</option>
                    <option value="48">48</option>
                    <option value="64">64</option>
                  </select>
                </div>
              </div>
            </fieldset>
          </div>
          <div id="create-project-form-section" style="grid-column: 1 / span 4; grid-row: 2;">
            <fieldset class="project-creation-tile-fieldset ">
              <legend>Map Area Initialization</legend>
              <div class="grid-container">
                <div
                  style="grid-column: 1 / span 3; grid-row: 1; border-bottom: 1px solid #ddd; padding-bottom: 16px;margin-bottom: 8px;">
                  <div class="grid-container">
                    <div style="grid-column: 1; grid-row: 1; margin:auto;">
                      <label style="margin-top: 8px;">Map Dimensions:</label>
                    </div>
                    <div style="grid-column: 2; grid-row: 1;">
                      <input type="number" placeholder="Width" id="map-dimensions-width-input" value="1280">
                    </div>
                    <div style="grid-column: 3; grid-row: 1;">
                      <input type="number" placeholder="Height" id="map-dimensions-height-input" value="720">
                    </div>
                  </div>
                </div>
                <div style="grid-column: 1 / span 3; grid-row: 2;">
                  <div class="grid-container">
                    <div style="grid-column: 1; grid-row: 1; margin: auto;">
                      <label for="layer-1">Tile Layer 1</label>
                    </div>
                    <div id="layer-1-input-container" style="grid-column: 2 / span 2; grid-row: 1;">
                      <input type="text" placeholder="Layer Name..." id="layer-1-name-input" name="layer-1"
                        value="Test">
                    </div>
                    <div style="grid-column: 1; grid-row: 2;">
                      <button id="import-tileset-button" type="button" style="height: 40px;"
                        class="secondary-button form-button">Import
                        Tileset</button>
                    </div>
                    <div style="grid-column: 2 / span 2; grid-row: 2;">
                      <input id="tileset-file-input" type="text" placeholder="Tileset file path"
                        value="/home/dmars/Pictures/Mar_Tiles.png" readonly>
                    </div>
                  </div>
                </div>
              </div>
            </fieldset>
          </div>
          <div style="grid-column-start: 3; grid-row: 3; margin-top: 20px;">
            <button type="button" id="create-project-button"
              class="primary-button form-button">Create&nbsp;Project</button>
          </div>
          <div style="grid-column: 4; grid-row: 3; margin-top: 20px;">
            <button id="cancel-create-project-button" class="secondary-button form-button">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="error-message-container" class="alert" style="display: none">
    <p id="error-message"></p>
  </div>
  <!-- You can also require other files to run in this process -->
  <script src="./landing.js"></script>
</body>

</html>

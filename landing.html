<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <!-- CSS only -->
  <link href="./styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <title>Dungeon Designer</title>
  <meta name="description" content="A browser-based 2D tile map editor. Design dungeons, rooms, and maps with pixel-art tilesets.">
  <meta property="og:title" content="Dungeon Designer">
  <meta property="og:description" content="A browser-based 2D tile map editor. Design dungeons, rooms, and maps with pixel-art tilesets.">
  <meta property="og:image" content="https://dungeon-designer.marshall-labs.com/Assets/preview.png">
  <meta property="og:url" content="https://dungeon-designer.marshall-labs.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dungeon Designer">
  <meta name="twitter:description" content="A browser-based 2D tile map editor. Design dungeons, rooms, and maps with pixel-art tilesets.">
  <meta name="twitter:image" content="https://dungeon-designer.marshall-labs.com/Assets/preview.png">
</head>

<body class="landing-page">
  <div id="landing-menu-card" class="card landing-menu-card">
    <header id="landing-header" class="landing-header">
      <img style="margin: auto;" src="./Assets/dungeondesignerlogo.png" />
    </header>
    <div id="landing-body" class="card-body landing-body">
      <div id="landing-menu" class="flex-container landing-menu">
        <div class="landing-button-container">
          <button id="new-project-button" title="New Project" type="button" class="primary-button landing-button"><img
              src="./Assets/dagger.png" width="60px" /></button>
          <span id="new-project-label" class="button-label">New</span>
        </div>
        <div class="landing-button-container">
          <button id="load-project-button" title="Load Project" type="button"
            class="secondary-button landing-button"><img src="./Assets/bow.png" width="60px" /></button>
          <span id="load-project-label" class="button-label">Load</span>
        </div>
        <div class="landing-button-container">
          <button id="github-button" title="View on GitHub" type="button" class="exit-button landing-button">🐙</button>
          <span id="github-label" class="button-label">GitHub</span>
        </div>
      </div>
    </div>
  </div>
  <div id="new-project-card" class="card new-project-menu-card">
    <header id="new-project-menu-header" class="new-project-menu-header">
      <img style="margin: auto;" src="./Assets/dungeondesignerlogo.png" />
    </header>
    <div id="new-project-card-body" class="new-project-card-body card-body">
      <div id="new-project-menu">
        <div class="grid-container project-creation-panel">
          <div style="grid-column: 1 / span 4; grid-row: 1;">
            <fieldset class="form-fieldset">
              <legend>Project Settings</legend>
              <div class="grid-container">
                <div style="grid-column: 1 / span 2; grid-row: 1;">
                  <label for="projectName" class="form-label">Name:</label>
                  <input type="text" id="project-name-input" class="form-input" name="projectName"
                    placeholder="Project name..." value="Test">
                </div>
                <div style="grid-column: 3; grid-row: 1;">
                  <label for="tilesizes" class="form-label">Default Tile Size:</label>
                  <select name="tilesizes" id="tile-size-select" class="form-select">
                    <option value="16">16</option>
                    <option value="32" selected>32</option>
                    <option value="48">48</option>
                    <option value="64">64</option>
                  </select>
                </div>
                <div style="grid-column: 4; grid-row: 1;">
                  <label for="layer-count" class="form-label">Layers:</label>
                  <select name="layer-count" id="layer-count-select" class="form-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                  </select>
                </div>
              </div>
            </fieldset>
          </div>
          <div id="create-project-form-section" style="grid-column: 1 / span 4; grid-row: 2;">
            <fieldset class="form-fieldset project-creation-tile-fieldset">
              <legend>Map Area Initialization</legend>
              <div class="grid-container">
                <div
                  style="grid-column: 1 / span 3; grid-row: 1; border-bottom: 1px solid #ddd; padding-bottom: 16px; margin-bottom: 8px;">
                  <div class="grid-container">
                    <div style="grid-column: 1; grid-row: 1; margin: auto;">
                      <label class="form-label" style="margin-top: 8px;">Map Dimensions:</label>
                    </div>
                    <div style="grid-column: 2; grid-row: 1;">
                      <input type="number" placeholder="Width" id="map-dimensions-width-input" class="form-input">
                    </div>
                    <div style="grid-column: 3; grid-row: 1;">
                      <input type="number" placeholder="Height" id="map-dimensions-height-input" class="form-input">
                    </div>
                  </div>
                </div>
                <div style="grid-column: 1 / span 3; grid-row: 2;">
                  <div class="grid-container">
                    <div class="layer-name-row" style="display: contents;">
                      <div style="grid-column: 1; margin: auto;">
                        <label for="layer-1" class="form-label">Layer 1</label>
                      </div>
                      <div style="grid-column: 2 / span 2;">
                        <input type="text" placeholder="Layer Name..." id="layer-1-name-input" class="form-input"
                          name="layer-1" value="Background">
                      </div>
                    </div>
                    <div class="layer-name-row" style="display: contents;">
                      <div style="grid-column: 1; margin: auto;">
                        <label for="layer-2" class="form-label">Layer 2</label>
                      </div>
                      <div style="grid-column: 2 / span 2;">
                        <input type="text" placeholder="Layer Name..." id="layer-2-name-input" class="form-input"
                          name="layer-2" value="Middle">
                      </div>
                    </div>
                    <div class="layer-name-row" style="display: contents;">
                      <div style="grid-column: 1; margin: auto;">
                        <label for="layer-3" class="form-label">Layer 3</label>
                      </div>
                      <div style="grid-column: 2 / span 2;">
                        <input type="text" placeholder="Layer Name..." id="layer-3-name-input" class="form-input"
                          name="layer-3" value="Foreground">
                      </div>
                    </div>
                    <div class="layer-name-row" style="display: contents;">
                      <div style="grid-column: 1; margin: auto;">
                        <label for="layer-4" class="form-label">Layer 4</label>
                      </div>
                      <div style="grid-column: 2 / span 2;">
                        <input type="text" placeholder="Layer Name..." id="layer-4-name-input" class="form-input"
                          name="layer-4" value="Overlay">
                      </div>
                    </div>
                    <div class="layer-name-row" style="display: contents;">
                      <div style="grid-column: 1; margin: auto;">
                        <label for="layer-5" class="form-label">Layer 5</label>
                      </div>
                      <div style="grid-column: 2 / span 2;">
                        <input type="text" placeholder="Layer Name..." id="layer-5-name-input" class="form-input"
                          name="layer-5" value="Top">
                      </div>
                    </div>
                    <div style="grid-column: 1;">
                      <button id="import-tileset-button" type="button" style="height: 40px;"
                        class="secondary-button form-button">Import
                        Tileset</button>
                    </div>
                    <div style="grid-column: 2 / span 2;">
                      <input id="tileset-file-input" class="form-input" type="text" placeholder="Tileset file path"
                        readonly>
                    </div>
                  </div>
                </div>
              </div>
            </fieldset>
          </div>
          <div style="grid-column-start: 3; grid-row: 3; margin-top: 20px;">
            <button type="button" id="create-project-button"
              class="primary-button form-button">Create&nbsp;Project</button>
          </div>
          <div style="grid-column: 4; grid-row: 3; margin-top: 20px;">
            <button id="cancel-create-project-button" class="secondary-button form-button">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Hidden file inputs -->
  <input type="file" id="tileset-file-picker" accept="image/png" style="display:none">
  <input type="file" id="open-project-file-picker" accept=".ddes" style="display:none">
  <script src="./landing.js" type="module"></script>
</body>

</html>

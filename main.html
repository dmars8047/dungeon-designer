<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <!-- CSS only -->
  <link href="./styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <title>Dungeon Designer</title>
</head>

<body>
  <div class="card">
    <header>
      <img src="./Assets/dungeondesignerlogo.png" />
      <div class="flex-container">
        <div class="flex-container">
          <div>
            <label for="layers">Layer:</label>
          </div>
          <div>
            <select name="layers" id="layer-select">
              <option value="0">Background</option>
              <option value="1">Foreground</option>
            </select>
          </div>
        </div>
        <div class="flex-container">
          <div>
            <label for="tilesizes">Tile Size:</label>
          </div>
          <div>
            <select name="tilesizes" id="tile-size-select">
              <option value="16">16</option>
              <option value="32" selected>32</option>
              <option value="48">48</option>
              <option value="64">64</option>
            </select>
          </div>
        </div>
        <div>
          <button type="button" id="open-file-button" class="primary-button">Import&nbsp;Tileset</button>
        </div>
        <div>
          <button id="clear-canvas-button" class="secondary-button">Clear&nbsp;Canvas</button>
        </div>
      </div>
    </header>
    <div class="card_body">
      <aside>
        <label>Tiles</label>
        <div id="tileset-container">
        </div>
      </aside>
      <div class="card_right-column">
        <!-- The main canvas -->
        <canvas id="main-canvas" width="1280" height="720">
        </canvas>
        <p class="instructions">
          <strong>Click</strong> to paint.
          <strong>Shift+Click</strong> to remove.
        </p>
        <!-- UI for layers -->
      </div>
    </div>
  </div>

  <!-- You can also require other files to run in this process -->
  <script src="./renderer.js"></script>
</body>

</html>

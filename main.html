<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <!-- CSS only -->
  <link href="./styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <title>Dungeon Designer</title>
</head>

<body>
  <div class="card" id="main-content">
    <header class="main-header">
      <img src="./Assets/dungeondesignerlogo.png" />
    </header>
    <div class="main-body card-body">
      <div id="main-console-container" class="main-console">
        <div id="tileset-section" class="tileset-aside card">
          <header id="tileset-header">
            <div class="tile-header-spacer">
            </div>
            <div class="tile-header-title">
              <label>Tiles</label>
            </div>
            <div class="tile-tool-container">
              <button id="btn-tile-settings" class="secondary-button" title="Tile Settings (T)">
                <img src="./Assets/hamburger_black.png" width="18px" />
              </button>
            </div>
          </header>
          <div id="tileset-container">
          </div>
        </div>
        <!-- The main canvas -->
        <div id="canvas-section" class="canvas-container card">
          <header id="map-header">
            <div class="map-header-spacer">
            </div>
            <div class="map-header-title">
              <label>Map</label>
            </div>
            <div class="map-tool-container">
              <button id="eraser-tool-btn" class="secondary-button" title="Eraser Tool (E)">
                <img src="./Assets/Eraser.png" width="18px" />
              </button>
              <button id="clear-canvas-button" class="secondary-button">Clear</button>
              <button id="btn-map-settings" class="secondary-button" title="Map Settings (M)">
                <img src="./Assets/hamburger_black.png" width="18px" />
              </button>
            </div>
          </header>
          <div id="canvas-wrapper">
            <canvas id="map-canvas">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- The Modal -->
  <div id="tile-settings-modal" class="modal">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
        <h1>Tile&nbsp;Settings</h1>
      </div>
      <button id="close-tile-settings-corner-button" class="secondary-button close" title="Close (Esc)">
        <img src="./Assets/close.png" width="18px" />
      </button>
      <div class="flex-container">
        <div></div>
        <div class="settings-label-container">
          <label for="tilesizes">Tile Size:</label>
        </div>
        <div class="settings-form-input-container">
          <select name="tilesizes" id="tile-size-select">
            <option value="16">16</option>
            <option value="32" selected>32</option>
            <option value="48">48</option>
            <option value="64">64</option>
          </select>
        </div>
      </div>
      <div class="flex-container">
        <div>
          <button type="button" id="open-file-button" class="primary-button">Import&nbsp;Tileset</button>
        </div>
      </div>
    </div>
  </div>
  <div id="map-settings-modal" class="modal">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
        <h1>Map&nbsp;Settings</h1>
      </div>
      <button id="close-map-settings-corner-button" class="secondary-button close" title="Close (Esc)">
        <img src="./Assets/close.png" width="18px" />
      </button>
      <div class="flex-container">
        <div class="settings-label-container">
          <label for="layers">Layer:</label>
        </div>
        <div class="settings-form-input-container">
          <select name="layers" id="layer-select">
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- You can also require other files to run in this process -->
  <script src="./renderer.js"></script>
</body>

</html>

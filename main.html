<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <!-- CSS only -->
  <link href="./styles.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <title>Dungeon Designer</title>
</head>

<body>
  <div class="card" id="main-content">
    <header class="main-header">
      <img src="./Assets/dungeondesignerlogo.png" />
    </header>
    <div class="main-body card-body">
      <div id="main-console-container" class="main-console">
        <div id="tileset-section" class="tileset-aside card">
          <header id="tileset-header">
            <div class="tile-header-spacer">
            </div>
            <div class="tile-header-title">
              <label>Tiles</label>
            </div>
            <div class="tile-tool-container">
            </div>
          </header>
          <div id="tileset-container">
          </div>
          <header id="prefab-header">
            <div class="tile-header-spacer">
            </div>
            <div class="tile-header-title">
              <label>Prefab Tile</label>
            </div>
            <div class="tile-tool-container">
            </div>
          </header>
          <div id="prefab-container">
          </div>
        </div>
        <!-- The main canvas -->
        <div id="canvas-section" class="canvas-container card">
          <header id="map-header">
            <div class="map-header-spacer flex-container">
              <button id="layers-btn" class="secondary-button tool-element" title="Layers (L)">
                <img src="./Assets/layers.png" width="18px" />
              </button>
              <select name="layers" id="layer-select" class="layer-select tool-element"></select>
              <button id="clear-layer-btn" class="secondary-button tool-element"
                title="Clear Layer Tiles">Clear</button>
            </div>
            <div class="map-header-title">
              <label>Map</label>
            </div>
            <div class="map-tool-container">
              <button id="brush-tool-btn" class="secondary-button tool-element" title="Brush Tool (B)">
                <img src="./Assets/brush.png" width="18px" />
              </button>
              <button id="select-tool-btn" class="secondary-button tool-element" title="Select Tool (Q)">
                <img src="./Assets/select.png" width="18px" />
              </button>
              <button id="eraser-tool-btn" class="secondary-button tool-element" title="Eraser Tool (E)">
                <img src="./Assets/Eraser.png" width="18px" />
              </button>
              <button id="collision-tool-btn" class="secondary-button tool-element" title="Collision Tool (C)">
                <img src="./Assets/collision_symbol.png" width="18px" />
              </button>
              <button id="fill-tool-btn" class="secondary-button tool-element" title="Fill Tool (G)">
                <img src="./Assets/bucket.png" width="18px" />
              </button>
              <button id="save-btn" class="secondary-button" title="Save (Ctrl+S)">
                <img src="./Assets/Save.png" width="18px" />
              </button>
              <button id="btn-map-settings" class="secondary-button tool-element" title="Map Settings (M)">
                <img src="./Assets/hamburger_black.png" width="18px" />
              </button>
            </div>
          </header>
          <div id="canvas-wrapper">
            <canvas id="map-canvas">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- The Modal -->
  <div id="project-settings-modal" class="modal">
    <!-- Modal content -->
    <div id="project-settings-modal-content" class="modal-content">
      <div class="modal-header">
        <h2>Project&nbsp;Settings</h2>
      </div>
      <div class="grid-container project-settings-form-container">
        <div style="grid-column: 1; grid-row: 1;">
          <label for="projectName" class="project-settings-label ">Name:</label>
        </div>
        <div style="grid-column: 2; grid-row: 1">
          <input type="text" id="project-name-input" name="projectName" placeholder="Project name...">
        </div>
        <div style="grid-column: 1; grid-row: 2;">
          <label class="project-settings-label">Map&nbsp;Dimensions:</label>
        </div>
        <div style="grid-column: 2; grid-row: 2;">
          <input type="number" placeholder="Width" id="map-dimensions-width-input" style="width:calc(50% - 5px);">
          <input type="number" placeholder="Height" id="map-dimensions-height-input" style="width:calc(50% - 5px);">
        </div>
        <div style="grid-column: 1; grid-row: 3;">
          <label class="project-settings-label">Map&nbsp;Background&nbsp;Color:</label>
        </div>
        <div style="grid-column: 2; grid-row: 3;">
          <input type="text" id="map-background-color-input" placeholder="#f4f8f9">
        </div>
        <div style="grid-column: 1 / span 2; grid-row: 4;">
          <button class="primary-button" id="project-settings-apply-button" type="button">Apply</button>
        </div>
      </div>
    </div>
  </div>
  <!-- You can also require other files to run in this process -->
  <script src="./renderer.js" type="module"></script>
</body>

</html>
